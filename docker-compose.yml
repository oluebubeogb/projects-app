services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projects}
      POSTGRES_DB: ${POSTGRES_DB:-projects}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Internal only — do not publish 5432 on the host (Coolify / other apps)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projects} -d ${POSTGRES_DB:-projects}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # Internal only — do not publish 6379 on the host
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      ALLOW_DEBUG: "1"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-postgresql://projects:projects@postgres:5432/projects}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    volumes:
      - projects-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collab:
        condition: service_started
    restart: unless-stopped

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    expose:
      - "1235"
    environment:
      HOCUSPOCUS_PORT: "1235"
      DATABASE_URL: ${DATABASE_URL:-postgresql://projects:projects@postgres:5432/projects}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  projects-data:
  postgres-data:
  redis-data:
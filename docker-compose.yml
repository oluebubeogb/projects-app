services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projects}
      POSTGRES_DB: ${POSTGRES_DB:-projects}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Published for local dev (host machine → container)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projects} -d ${POSTGRES_DB:-projects}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      ALLOW_DEBUG: "1"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      DATABASE_URL: postgres://${POSTGRES_USER:-projects}:${POSTGRES_PASSWORD:-projects}@postgres:5432/${POSTGRES_DB:-projects}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    volumes:
      - uploads-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collab:
        condition: service_started
    restart: unless-stopped

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    expose:
      - "1235"
    ports:
      # Optional: expose for local WebSocket testing without proxy
      - "1235:1235"
    environment:
      HOCUSPOCUS_PORT: "1235"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-projects}:${POSTGRES_PASSWORD:-projects}@postgres:5432/${POSTGRES_DB:-projects}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads-data:

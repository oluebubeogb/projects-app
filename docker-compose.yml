services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      ALLOW_DEBUG: "1"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-wss://ws.project.collab.name.ng}
    volumes:
      - projects-data:/data
    depends_on:
      - collab
    restart: unless-stopped

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    # Use 1235 host port to avoid clash with other apps on 1235
    ports:
      - "1235:1235"
    environment:
      HOCUSPOCUS_PORT: "1235"
      DATA_DIR: /data
    volumes:
      - projects-data:/data
    restart: unless-stopped

volumes:
  projects-data:

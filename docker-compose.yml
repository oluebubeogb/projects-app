services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projects}
      POSTGRES_DB: ${POSTGRES_DB:-projects}
      PGPORT: "5433"
    command: ["postgres", "-p", "5433"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projects} -d ${POSTGRES_DB:-projects} -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]
    volumes:
      - redis-data:/data
    expose:
      - "6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    # Coolify proxies to this container port — do not bind host 3010
    expose:
      - "3010"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      ALLOW_DEBUG: "1"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-postgresql://projects:projects@postgres:5433/projects}
      REDIS_URL: ${REDIS_URL:-redis://redis:6380}
      NEXT_PUBLIC_HOCUSPOCUS_URL: ${NEXT_PUBLIC_HOCUSPOCUS_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      PORT: "3010"
      # Demo content: set SEED_DEMO=1 (and optionally CLEAR_DEMO=1) in .env
      SEED_DEMO: ${SEED_DEMO:-}
      CLEAR_DEMO: ${CLEAR_DEMO:-}
    volumes:
      - projects-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      collab:
        condition: service_started
    restart: unless-stopped

  collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    expose:
      - "1236"
    environment:
      HOCUSPOCUS_PORT: "1236"
      DATABASE_URL: ${DATABASE_URL:-postgresql://projects:projects@postgres:5433/projects}
      REDIS_URL: ${REDIS_URL:-redis://redis:6380}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # pgAdmin — same network as postgres → host "postgres" / port 5433 works
  # Coolify: domain https://pga.project.collab.name.ng on this service (port 80)
  pgadmin:
    image: 'dpage/pgadmin4:latest'
    environment:
      PGADMIN_DEFAULT_EMAIL: '${PGADMIN_DEFAULT_EMAIL:-admin@mova.cms}'
      PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_DEFAULT_PASSWORD:-change-me-pgadmin}'
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - 'pgadmin-data:/var/lib/pgadmin'
    expose:
      - '80'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    
volumes:
  projects-data:
  postgres-data:
  redis-data
